services:
  searxng:
    image: searxng/searxng:latest
    container_name: makoclaw_searxng
    volumes:
      - searxng_data:/etc/searxng
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - makoclaw_network
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  makoclaw:
    image: makoclaw:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: makoclaw
    command: ["makoclaw", "web"]
    ports:
      - "${MAKOCLAW_PORT:-127.0.0.1:18880}:18880"
    environment:
      # === REQUIRED CONFIGURATION ===
      # Web password for authentication (default: changeme - CHANGE IN PRODUCTION!)
      MAKOCLAW_WEB_PASSWORD: "${MAKOCLAW_WEB_PASSWORD:-changeme}"

      # === OPTIONAL: LLM Provider Configuration ===
      # Leave these UNSET to start in DEGRADED MODE
      # In degraded mode:
      #   ✅ Web UI accessible at http://localhost:18880
      #   ✅ Setup Wizard available for easy configuration
      #   ❌ Agent/AI features disabled until provider configured
      #
      # To pre-configure LLM provider, uncomment and set:
      # MAKOCLAW_AGENTS_DEFAULTS_PROVIDER: "openrouter"
      # MAKOCLAW_AGENTS_DEFAULTS_MODEL: "anthropic/claude-3.5-sonnet"
      #
      # Supported providers:
      #   - ollama (self-hosted, free)
      #   - openrouter (multiple models, free tier)
      #   - anthropic (Claude)
      #   - openai (GPT)
      #   - groq (fast inference, free tier)
      #
      # Documentation: https://github.com/sipeed/MakoClaw/blob/main/docs/guides/degraded-mode.md

      # === Basic Configuration ===
      MAKOCLAW_AGENTS_DEFAULTS_RESTRICT_TO_WORKSPACE: "true"
      MAKOCLAW_AGENTS_DEFAULTS_WORKSPACE: "/home/makoclaw/.MakoClaw/workspace"
      MAKOCLAW_STORAGE_PATH: "/home/makoclaw/.MakoClaw/MakoClaw.db"
      MAKOCLAW_WEB_ENABLED: "true"
      MAKOCLAW_WEB_HOST: 0.0.0.0
      MAKOCLAW_WEB_PORT: "18880"
      MAKOCLAW_WEB_USERNAME: admin

      # === Provider API Keys (OPTIONAL) ===
      # Uncomment the provider you want to use:
      # MAKOCLAW_PROVIDERS_OPENROUTER_API_KEY: "${MAKOCLAW_PROVIDERS_OPENROUTER_API_KEY}"
      # MAKOCLAW_PROVIDERS_ANTHROPIC_API_KEY: "${MAKOCLAW_PROVIDERS_ANTHROPIC_API_KEY}"
      # MAKOCLAW_PROVIDERS_OPENAI_API_KEY: "${MAKOCLAW_PROVIDERS_OPENAI_API_KEY}"
      # MAKOCLAW_PROVIDERS_GROQ_API_KEY: "${MAKOCLAW_PROVIDERS_GROQ_API_KEY}"
      # MAKOCLAW_PROVIDERS_OLLAMA_API_BASE: "http://host.docker.internal:11434"

      # === Email Tools (OPTIONAL) ===
      MAKOCLAW_TOOLS_EMAIL_ENABLED: "false"
      MAKOCLAW_TOOLS_EMAIL_HOST: "smtp.gmail.com"
      MAKOCLAW_TOOLS_EMAIL_PORT: "587"
      MAKOCLAW_TOOLS_EMAIL_USERNAME: "${MAKOCLAW_TOOLS_EMAIL_USERNAME:-}"
      MAKOCLAW_TOOLS_EMAIL_PASSWORD: "${MAKOCLAW_TOOLS_EMAIL_PASSWORD:-}"
      MAKOCLAW_TOOLS_EMAIL_FROM: "${MAKOCLAW_TOOLS_EMAIL_FROM:-}"
      MAKOCLAW_TOOLS_EMAIL_TO: "${MAKOCLAW_TOOLS_EMAIL_TO:-}"

      # === Web Search (SearXNG) ===
      MAKOCLAW_TOOLS_WEB_SEARCH_SEARXNG_URL: "http://searxng:8080"
    volumes:
      # MakoClaw-data/ contains:
      #   MakoClaw.db     - legacy shared database (backward compat)
      #   central.db      - auth database (users, settings, JWT secrets)
      #   users/{uuid}/   - per-user isolated data:
      #     user.db       - per-user database (chats, tasks, knowledge)
      #     workspace/    - per-user workspace files
      #     config.json   - per-user config (providers, channels)
      #   config.json     - server-level config
      - makoclaw_data:/home/makoclaw/.MakoClaw
    restart: unless-stopped
    networks:
      - makoclaw_network
    depends_on:
      - searxng
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  makoclaw_data:
    driver: local
  searxng_data:
    driver: local

networks:
  makoclaw_network:
    driver: bridge
